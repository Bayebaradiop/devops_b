spring:
  application:
    name: todoapp

  datasource:
    # Aucune valeur sensible en dur : tout vient de l'environnement.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todoapp}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    # Le schema est cree par db/init/01-schema.sql : Hibernate se contente de le verifier.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

  # L'application tourne DERRIERE le reverse proxy Nginx. Sans cette ligne, elle
  # se croit appelee en "http://10.0.2.10:8080" (ce que voit Tomcat), alors que
  # le visiteur, lui, est en "https://<domaine>". Spring classe alors les requetes
  # du site comme du cross-origin et les refuse (403 "Invalid CORS request").
  #
  # Avec "framework", Spring reconstruit l'URL reelle a partir des en-tetes
  # X-Forwarded-* envoyes par Nginx.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
