spring.application.name=medishop-backend
server.port=${SERVER_PORT:8090}

# Base par defaut : H2 en memoire (dev / tests, aucune installation requise).
# Pour PostgreSQL : lancer avec --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:medishop;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Charge data.sql apres la creation du schema par Hibernate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

management.endpoints.web.exposure.include=health,info
