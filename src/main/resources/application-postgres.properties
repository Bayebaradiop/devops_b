# Profil PostgreSQL : utilise par docker-compose et en production.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5439}/${DB_NAME:medishop}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:medishop}
spring.datasource.password=${DB_PASSWORD:medishop}

spring.jpa.hibernate.ddl-auto=update
# data.sql est idempotent : on peut le rejouer a chaque demarrage sans creer de doublons
spring.sql.init.mode=always
spring.h2.console.enabled=false
